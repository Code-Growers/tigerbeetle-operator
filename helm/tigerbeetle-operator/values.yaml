# Default values for tigerbeetle-operator.

# -- Replicas of the operator itself. Leader election makes one of them active.
replicaCount: 1

image:
  # -- Operator image repository.
  repository: ghcr.io/code-growers/tigerbeetle-operator
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""

# Init helper image used by TigerBeetle pods and format Jobs. The operator only passes this
# reference to the pods it creates; it never runs the image itself.
initImage:
  # -- Init helper image repository.
  repository: ghcr.io/code-growers/tigerbeetle-operator-init
  # -- Init helper image tag. Defaults to the chart appVersion.
  tag: ""

# -- Image pull secrets for both images.
imagePullSecrets: []

# -- Override the chart name.
nameOverride: ""
# -- Override the fully qualified release name.
fullnameOverride: ""

crds:
  # -- Install the TigerBeetleCluster CRD. They are templates, so `helm upgrade` updates them.
  install: true
  # -- Keep the CRD (and therefore every TigerBeetleCluster) when the release is uninstalled.
  keep: true

# -- Minimum log level: debug, info, warn or error.
logLevel: info
# -- Log format: json or text.
logFormat: json

# -- Run with leader election, so several operator replicas stay safe.
leaderElection: true

metrics:
  # -- Serve controller-runtime metrics and create a Service for them.
  enabled: true
  # -- Port the metrics endpoint binds to.
  port: 8443
  # -- Require authentication and authorization for metrics (`--metrics-secure`). The chart
  # creates a metrics-reader ClusterRole for scrapers.
  secure: true
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor. Needs its CRD in the cluster.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Extra labels, e.g. the release label your Prometheus selects on.
    labels: {}

# -- Extra command line arguments for the manager.
extraArgs: []

serviceAccount:
  # -- Create a ServiceAccount and the operator's RBAC.
  create: true
  # -- Mount the ServiceAccount token in the pod.
  automount: true
  # -- Annotations for the ServiceAccount.
  annotations: {}
  # -- ServiceAccount name. Generated when empty.
  name: ""

# -- Annotations for the operator pod.
podAnnotations: {}
# -- Labels for the operator pod.
podLabels: {}

# -- Pod security context.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# -- Container security context.
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

# -- Compute resources for the operator. TigerBeetle replicas are sized in the
# TigerBeetleCluster resource, not here.
resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

# -- Node selector for the operator pod.
nodeSelector: {}
# -- Tolerations for the operator pod.
tolerations: []
# -- Affinity for the operator pod.
affinity: {}
# -- Priority class for the operator pod.
priorityClassName: ""
