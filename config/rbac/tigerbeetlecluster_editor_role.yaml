# This rule is not used by the project tigerbeetle-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the tigerbeetle.codegrowers.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tigerbeetle-operator
    app.kubernetes.io/managed-by: kustomize
  name: tigerbeetlecluster-editor-role
rules:
- apiGroups:
  - tigerbeetle.codegrowers.com
  resources:
  - tigerbeetleclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tigerbeetle.codegrowers.com
  resources:
  - tigerbeetleclusters/status
  verbs:
  - get
