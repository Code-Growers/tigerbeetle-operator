# This rule is not used by the project tigerbeetle-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over tigerbeetle.codegrowers.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tigerbeetle-operator
    app.kubernetes.io/managed-by: kustomize
  name: tigerbeetlecluster-admin-role
rules:
- apiGroups:
  - tigerbeetle.codegrowers.com
  resources:
  - tigerbeetleclusters
  verbs:
  - '*'
- apiGroups:
  - tigerbeetle.codegrowers.com
  resources:
  - tigerbeetleclusters/status
  verbs:
  - get
