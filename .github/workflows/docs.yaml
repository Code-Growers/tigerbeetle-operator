# Builds the documentation site (Astro + Starlight, in site/, rendering the Markdown in docs/) and
# publishes it to GitHub Pages. Pull requests only build it and check its links, so a broken link
# fails before it is published.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          # Keep in line with the nodejs package in flake.nix.
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run build

      # Pages link to each other by absolute path under the site's base (/tigerbeetle-operator/),
      # so the check resolves them against a directory that places dist/ at that path.
      - name: Prepare link check
        run: |
          mkdir -p "$RUNNER_TEMP/site-root"
          ln -s "$PWD/dist" "$RUNNER_TEMP/site-root/tigerbeetle-operator"
      # Internal links and #fragments only (--offline): external sites being down must not block
      # the docs.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress --include-fragments --index-files index.html
            --root-dir ${{ runner.temp }}/site-root 'site/dist/**/*.html'
          fail: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
