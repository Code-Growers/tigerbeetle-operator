# Publishes the operator image, the init helper image and the Helm chart for a tag.
#
# This one does not go through Dagger: a release runs only in CI, so the local/CI parity Dagger
# buys the checks is worth little here, while its cold start costs minutes on every run (engine
# boot plus building the Dagger module itself, neither of which GitHub can cache). buildx stores
# layers in GitHub's cache instead, so repeat releases skip the Go build entirely.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/code-growers

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Images and chart share one plain SemVer version: chart versions reject a leading "v".
      - name: Resolve version
        id: version
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      # The Dockerfiles build on the native platform and cross-compile with GOARCH, so the arm64
      # image needs no emulation: its final stage only copies a binary.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the operator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/tigerbeetle-operator:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/tigerbeetle-operator:latest
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

      - name: Build and push the init helper image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.init
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/tigerbeetle-operator-init:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/tigerbeetle-operator-init:latest
          cache-from: type=gha,scope=init
          cache-to: type=gha,mode=max,scope=init

      - uses: azure/setup-helm@v4
      - name: Package and push the Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # appVersion becomes the default image tag in the chart, so a released chart installs
          # the images from this same release.
          helm package helm/tigerbeetle-operator \
            --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/tigerbeetle-operator-${VERSION}.tgz" "oci://${REGISTRY}/charts"
