kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Registry hosts are configured per node in certs.d by kind.sh; containerd 2 removed registry.mirrors.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
# kind.sh appends one `- role: worker` per KIND_WORKERS to this list, so `nodes` stays last.
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
